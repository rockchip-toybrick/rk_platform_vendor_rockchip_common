
# print debug_log or not  # TRUE / FALSE
DEBUG_TAG = TRUE

# UART where Bluetooth device is attached (if it applies)
Device = /dev/ttyS1

# Set Frameware path
FwPath = /vendor/etc/firmware/

# Working (setup on initialization) speed of the Bluetooth chipset
Speed = 3000000

# usleep time for segment
Seg_usleep_time = 1000

# usleep time for Download tlv file
Tlv_usleep_time = 100000
